<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designed Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

    <!-- Main Box -->
    <div class="w-[600px] mx-auto bg-white shadow-xl rounded ">

        <!-- Header -->
        <div class="bg-blue-500 text-white p-4 text-xl font-semibold">Header</div>

        <!-- Menu -->
        <div class="bg-gray-200 p-3 flex     gap-4 text-sm font-medium">
            <div class=" hover:text-blue-600">Home</div>
            <div class=" hover:text-blue-600">About</div>
            <div class=" hover:text-blue-600">Services</div>
            <div class=" hover:text-blue-600">Contact</div>
        </div>

        <!-- About -->
        <div class="p-4">
            <h2 class="text-lg font-semibold mb-2">About</h2>
            
        </div>

        <!-- Content Box -->
        <div class="p-4 bg-blue-50 rounded-lg mx-3 mb-4">
            <h2 class="font-semibold text-lg mb-2">Contents</h2>
        </div>

        <!-- Gallery -->
        <div class="p-4">
            
            <div class="grid grid-cols-3 gap-3">
                <div class="w-full h-20 bg-gray-300 rounded"></div>
                <div class="w-full h-20 bg-gray-300 rounded"></div>
                <div class="w-full h-20 bg-gray-300 rounded"></div>
            </div>
        </div>

        <!-- Clients -->
        <div class="p-4">   
            <h2 class="text-lg font-semibold mb-2">Clients</h2>
            <ul class="list-decimal pl-5 text-sm text-gray-700">
                <li>Client A</li>
                <li>Client B</li>
                <li>Client C</li>
            </ul>
        </div>

        <!-- Footer -->
        <div class="bg-slate-600 text-white text-center p-3">Footer</div>
    </div>

</body>
</html>
