<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <header>
        <div class="container mx-auto px-4">
            <div class="w-full text-white bg-slate-600 text-center font-semibold border-black">Notice</div>
           <div class="flex items-center justify-between bg-blue-300 h-8 border-black">
            <h2 class="font-semibold pl-3 text-lg text-slate-700">Nimesh</h2>
            <nav class="hidden md:block ">
                <a href="" class="p-3 font-semibold text-slate-700 hover:text-blue-500 hover:animate-pulse">Home</a>
                <a href="" class="p-3 font-semibold text-slate-700 hover:text-blue-500 hover:animate-pulse">About</a>
                <a href="" class="p-3 font-semibold text-slate-700 hover:text-blue-500 hover:animate-pulse">Blogs</a>
                <a href="" class="p-3 font-semibold text-slate-700 hover:text-blue-500 hover:animate-pulse">Contact</a>
            </nav>
            <div class="flex items-center justify-between gap-3 pr-3">
                <button>
                    <i class="fas fa-moon hidden md:block text-slate-700 hover:text-blue-600 hover:text-lg"></i>
                </button>
                <button>
                    <i class="fas fa-shopping-cart hidden md:block text-slate-700 hover:text-blue-600 hover:text-lg"></i>
                </button>
                <button>
                    <i class="fas fa-user hidden md:block text-slate-700 hover:text-blue-600 hover:text-lg"></i>
                </button>
                <button>
                    <i class="fas fa-bars md:hidden block text-slate-700 hover:text-blue-600 hover:text-lg"></i>
                </button>
            </div>

           </div>

        </div>
    </header>

    <section class="my-5">
        <div class="container mx-auto px-3 w-[50%] h-auto border-2 border-black border-solid bg-slate-200">
            <div class="header w-[100%] mx-auto h-auto border-2 border-black  border-solid my-5 text-center font-semibold bg-slate-300 hover:bg-slate-400 ">Header</div>
            <div class="flex justify-between">
                <div class="nav-box w-[25%] m-1 h-[300px] text-center font-semibold bg-slate-300 border-2 border-black border-solid hover:bg-slate-400">nav</div>
                <div class="main-box w-[100%] h-[300px] text-center font-semibold bg-slate-300 border-2 border-black border-solid ">
                    <h3>main</h3>
                    <div class="article1-box w-auto h-auto border-2 border-black border-solid m-3 py-5 hover:bg-slate-400">Article1</div>
                    <div class="article2-box w-auto h-auto border-2 border-black border-solid py-5 m-3 hover:bg-slate-400   ">Article2</div>
                </div>
            </div>

            <div class="footer-box w-full h-auto border-2 border-black border-solid text-center font-semibold p-1 my-1 bg-slate-300 hover:bg-slate-400">Footer</div>

        </div>

    </section>
    
</body>
</html>
