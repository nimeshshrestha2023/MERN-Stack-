
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
/* universal selector */
*{
margin: 0;
padding: 0;
box-sizing: border-box;
}
/* id selector */
#register{
color: white;
width: 70%;
margin: auto;
background-image: linear-gradient(200deg,#3916c5,rgb(10, 154, 70),rgb(105, 25, 105));
margin-top: 50px;
padding: 20px;
}
/* descendant selector */
#register h1{
text-align: center;
color: #fff;
}
/* descendant */
#register fieldset{
padding: 20px;
}
/* class selector */
div.form-group{
padding: 5px;
border-bottom: 1px solid white;
}

div.form-group label{
width: 25%;
display: inline-block;
font-size: 20px;
}
div.form-group input,select{
width: 70%;
border: none;
height: 25px;
border-radius: 5px;
padding-left: 10px;
}

/* attribute selector */
div.form-group input[type='radio'],input[type='checkbox']{
width: 7% !important;
height: initial !important;
}



div.form-group input.button{
width: 100px;
border: none;
}

div.form-group input.button[type='submit']:hover{
background-color: rgb(31, 79, 23);
color: white;
}

div.form-group input.button[type='reset']:hover{
background-color: rgb(207, 21, 0);
color: white;
}

div.form-group:last-child{
border-bottom: none;
}
    </style>
</head>

<body>
    <div id="register">
        <h1>Register Form</h1>
        <form action="" method="" enctype="" novalidate>
            <fieldset>
                <legend>Personal Information</legend>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label for="dov">Date of birth</label>
                    <input type="date" name="dob" id="dob" placeholder="Enter dob">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="number" name="phone" id="phone" placeholder="Enter phone">
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <input type="radio" name="gender" value="male">Male
                    <input type="radio" name="gender" value="female"> Female
                </div>
                <div class="form-group">
                    <label for="image">Profile Image</label>
                    <input type="file">
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <select name="" id="">
                        <option value="">Select Country</option>
                        <option value="np">Nepal</option>
                        <option value="in">India</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="checkbox" name="term"> I accept term & condition
                </div>
                <div class="form-group">
                    <input type="submit" class="button" value="Register" />
                    <input type="reset" class="button" value="Clear" />

                </div>
            </fieldset>
        </form>
    </div>
</body>

</html>
